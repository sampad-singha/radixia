name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
  
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository (REQUIRED)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup PHP (required for Laravel context)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, mysql
          coverage: none

      # 3. Install dependencies (no dev execution, safe for CI)
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # 4. SonarCloud scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=sampad-singha_radixia
            -Dsonar.organization=sampad-singha
            -Dsonar.sources=app,routes,resources
            -Dsonar.tests=tests
            -Dsonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,test-frontend/*,resources/css,resources/js
            -Dsonar.sourceEncoding=UTF-8
