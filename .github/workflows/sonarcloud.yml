name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    # Global Env ensures Database Service sees these credentials on startup
    env:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      APP_ENV: testing
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Tests with Coverage
        run: |
          docker compose up -d --wait mysql
          docker compose run --rm --build \
          app sh -c "
            git config --global --add safe.directory /var/www/html && 
            composer install --no-interaction --prefer-dist && 
            cp .env.docker .env && 
            php artisan key:generate && 
            php artisan migrate --force && 
            # 1. Force PCOV enabled via PHP flag
            # 2. Use vendor/bin/phpunit directly to ensure coverage clover is captured
            php -d pcov.enabled=1 vendor/bin/phpunit --coverage-clover=coverage.xml && 
          
            # 3. Check if file exists before running chmod to avoid the error you just saw
            if [ -f coverage.xml ]; then
              sync && chmod 666 coverage.xml;
            else
              echo '!!! ERROR: coverage.xml was NOT generated. Check if PCOV is loaded. !!!';
              php -m | grep pcov; # Debug: check if PCOV is even in the module list
              exit 1;
            fi
          "

      - name: Fix Coverage Paths
        # Removes the Docker path so SonarCloud can find the files in the repo
        run: sed -i 's|/var/www/html/||g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=sampad-singha_radixia
            -Dsonar.organization=sampad-singha
            -Dsonar.sources=app,routes,resources
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,resources/css/**,resources/js/**
            -Dsonar.sourceEncoding=UTF-8
