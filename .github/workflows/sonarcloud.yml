name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    # Global Env ensures Database Service sees these credentials on startup
    env:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      APP_ENV: testing
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Tests with Coverage
        run: |
          docker compose up -d --wait mysql
          # Run tests and explicitly ensure the file is written to the host volume
          docker compose run --rm --build \
          -e XDEBUG_MODE=coverage \
          app sh -c "
            git config --global --add safe.directory /var/www/html && 
            composer install --no-interaction --prefer-dist && 
            cp .env.docker .env && 
            php artisan key:generate && 
            php artisan migrate --force && 
            php artisan test --coverage-clover=coverage.xml &&
            chmod 666 coverage.xml &&
            sync
          "
          # Wait a split second for Docker volume sync to catch up
          sleep 2

      - name: Fix Coverage Paths
        # Removes the Docker path so SonarCloud can find the files in the repo
        run: sed -i 's|/var/www/html/||g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=sampad-singha_radixia
            -Dsonar.organization=sampad-singha
            -Dsonar.sources=app,routes,resources
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,resources/css/**,resources/js/**
            -Dsonar.sourceEncoding=UTF-8
