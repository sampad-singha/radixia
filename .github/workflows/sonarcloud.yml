name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # CHANGE IS HERE: Define these GLOBALLY so Docker-Compose sees them 
    # when starting the Database, NOT just when running the App.
    # ------------------------------------------------------------------
    env:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: radixia
      DB_USERNAME: sail
      DB_PASSWORD: password
      APP_ENV: testing
      # SonarCloud Secrets
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Tests with Coverage
        run: |
          # Now when this runs, it sees 'DB_USERNAME=sail' from the global env
          # and actually CREATES the 'sail' user inside MySQL.
          docker compose up -d --wait mysql

          # We don't need to repeat the -e flags here anymore
          docker compose run --rm \
          -e XDEBUG_MODE=coverage \
          app sh -c "
            composer install --no-interaction --prefer-dist && 
            cp .env.docker .env && 
            php artisan key:generate && 
            php artisan migrate --force && 
            php artisan test --coverage-clover=coverage.xml
          "

      - name: Fix Coverage Paths
        run: sed -i 's|/var/www/html/||g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=sampad-singha_radixia
            -Dsonar.organization=sampad-singha
            -Dsonar.sources=app,routes,resources
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,resources/css/**,resources/js/**
            -Dsonar.sourceEncoding=UTF-8
